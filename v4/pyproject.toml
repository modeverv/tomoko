[project]
name = "tomoko-v4"
version = "0.0.0"
description = "Tomoko v4: 既製の部品と指揮者で作る全二重の対話エンジンと、その採点の仕組み"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "soundfile>=0.13",
    "websockets>=15",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.9"]
# 出力音声の発話区間を取る VAD
vad = ["silero-vad>=5.1"]
# 対話エンジン
engine = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "silero-vad>=5.1",
    "mlx-whisper>=0.4",
    "kokoro-mlx>=0.1",
    "misaki[ja]>=0.9",
    "maai>=0.2.27",
]
# 中身の採点: 書き起こしと採点役
content = ["mlx-whisper>=0.4", "anthropic>=0.80"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench", "engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: 外部プロセス・モデル・ネットワークを使わない速い試験",
    "integration: 手元の WebSocket や TTS、VAD を実際に動かす試験",
]

[tool.ruff]
line-length = 100
