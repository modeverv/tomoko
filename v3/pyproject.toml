[project]
name = "tomoko-v3"
version = "0.0.0"
description = "Tomoko v3: full-duplex single-model experiments"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tomoko_v3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 外部プロセス・モデル・ネットワークを使わない速い試験",
]
